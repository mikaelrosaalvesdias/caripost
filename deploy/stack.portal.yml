version: '3.8'

networks:
  metaporn_internal:
    external: true

services:
  frontend-portal:
    image: frontend-portal:latest
    ports:
      - target: 80
        published: 8788
        protocol: tcp
        mode: host
    networks:
      - metaporn_internal
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.docker.network=metaporn_internal
        - traefik.http.routers.metaporn-creator.rule=Host(`criador.caripost.n8nmikael.com.br`)
        - traefik.http.routers.metaporn-creator.entrypoints=websecure
        - traefik.http.routers.metaporn-creator.tls=true
        - traefik.http.routers.metaporn-creator.tls.certresolver=letsencrypt
        - traefik.http.services.metaporn-creator.loadbalancer.server.port=80
