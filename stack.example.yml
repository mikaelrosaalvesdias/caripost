# NOTA: os nomes de servico/volume/rede/bucket abaixo (adult-meta, adult_meta_data,
# metaporn_internal, bucket "metaporn") sao IDENTIFICADORES DE INFRA em producao.
# O produto se chama Caripost, mas renomea-los aqui cria volumes/rede/bucket novos
# e derruba dados e uploads. So renomeie junto com uma migracao planejada.
version: '3.8'

networks:
  metaporn_internal:
    external: true

volumes:
  adult_meta_data:

services:
  adult-meta:
    image: adult-meta:latest
    networks:
      - metaporn_internal
    volumes:
      - adult_meta_data:/data
      - /var/www2/adult-meta-media:/media
    environment:
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}"
      S3_BUCKET: "${S3_BUCKET:-metaporn}"
      S3_PUBLIC_BASE_URL: "${S3_PUBLIC_BASE_URL}"
      CARIPOST_API_KEY: "${CARIPOST_API_KEY}"
      CARIPOST_MEDIA_ROOT: "/media"
      CARIPOST_MEDIA_URL_SECRET: "${CARIPOST_MEDIA_URL_SECRET}"
      METAPORN_ENCRYPTION_KEY: "${METAPORN_ENCRYPTION_KEY}"
      PORTAL_JWT_SECRET: "${PORTAL_JWT_SECRET}"
      AUTH_SESSION_SECRET: "${AUTH_SESSION_SECRET}"
      SOCIAL_COMPOSIO_ENABLED: "${SOCIAL_COMPOSIO_ENABLED:-1}"
      COMPOSIO_API_KEY: "${COMPOSIO_API_KEY:-}"
      COMPOSIO_BASE_URL: "${COMPOSIO_BASE_URL:-https://backend.composio.dev}"
      COMPOSIO_PROJECT_ID: "${COMPOSIO_PROJECT_ID:-}"
      COMPOSIO_WEBHOOK_SECRET: "${COMPOSIO_WEBHOOK_SECRET:-}"
      COMPOSIO_AUTH_CONFIG_INSTAGRAM: "${COMPOSIO_AUTH_CONFIG_INSTAGRAM:-}"
      COMPOSIO_AUTH_CONFIG_FACEBOOK: "${COMPOSIO_AUTH_CONFIG_FACEBOOK:-}"
      COMPOSIO_AUTH_CONFIG_YOUTUBE: "${COMPOSIO_AUTH_CONFIG_YOUTUBE:-}"
      COMPOSIO_AUTH_CONFIG_TIKTOK: "${COMPOSIO_AUTH_CONFIG_TIKTOK:-}"
      COMPOSIO_TOOL_INSTAGRAM_PUBLISH: "${COMPOSIO_TOOL_INSTAGRAM_PUBLISH:-}"
      COMPOSIO_TOOL_FACEBOOK_PUBLISH: "${COMPOSIO_TOOL_FACEBOOK_PUBLISH:-}"
      COMPOSIO_TOOL_YOUTUBE_PUBLISH: "${COMPOSIO_TOOL_YOUTUBE_PUBLISH:-}"
      COMPOSIO_TOOL_TIKTOK_PUBLISH: "${COMPOSIO_TOOL_TIKTOK_PUBLISH:-}"
      BURN_MAX_PARALLEL: "1"
      FFMPEG_BURN_THREADS: "0"
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.docker.network=metaporn_internal
        - traefik.http.routers.metaporn.rule=Host(`caripost.n8nmikael.com.br`)
        - traefik.http.routers.metaporn.entrypoints=websecure
        - traefik.http.routers.metaporn.tls=true
        - traefik.http.routers.metaporn.tls.certresolver=letsencrypt
        - traefik.http.services.metaporn.loadbalancer.server.port=8765
