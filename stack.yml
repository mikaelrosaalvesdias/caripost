version: '3.8'

networks:
  n8nmikaelnet:
    external: true

volumes:
  adult_meta_data:

services:
  adult-meta:
    image: adult-meta:latest
    networks:
      - n8nmikaelnet
    volumes:
      - adult_meta_data:/data
      - /var/www2/adult-meta-media:/media
    environment:
      S3_ENDPOINT_URL: "https://s3.n8nmikael.com.br"
      S3_ACCESS_KEY_ID: "0e1fb1161ed4f7c0a41b0fa7"
      S3_SECRET_ACCESS_KEY: "64ac389164e77eb46ef7bc9bb3791fd5a0803abdb51cc52a"
      S3_BUCKET: "metaporn"
      S3_PUBLIC_BASE_URL: "https://s3.n8nmikael.com.br"
      ADULT_META_MEDIA_ROOT: "/media"
      BURN_MAX_PARALLEL: "1"
      FFMPEG_BURN_THREADS: "0"
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.docker.network=n8nmikaelnet
        - traefik.http.routers.metaporn.rule=Host(`metaporn.n8nmikael.com.br`)
        - traefik.http.routers.metaporn.entrypoints=websecure
        - traefik.http.routers.metaporn.tls=true
        - traefik.http.routers.metaporn.tls.certresolver=letsencrypt
        - traefik.http.services.metaporn.loadbalancer.server.port=8765
